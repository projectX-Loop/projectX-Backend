services:
  postgres:
    image: pgvector/pgvector:pg16-bookworm
    container_name: projectx-postgres
    restart: unless-stopped
    env_file:
      - ${PROJECTX_ENV_FILE:-/etc/projectx/backend.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - projectx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  projectx_postgres_data:
